name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Prueba_CI_2026!
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Prueba_CI_2026!' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: Server=localhost,1433;Database=transporte_test;User Id=sa;Password=Prueba_CI_2026!;Encrypt=true;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas (API con SQL Server y app)
        run: npm test
      - name: Compilación
        run: npm run build
      - name: Paquete para Azure App Service
        run: scripts/empaquetar.sh paquete.zip

  importador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pytest
      - run: python -m pytest scripts -q

  infraestructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar plantilla Bicep
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
