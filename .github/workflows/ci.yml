name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: transporte
          POSTGRES_PASSWORD: transporte
          POSTGRES_DB: transporte_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transporte"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://transporte:transporte@localhost:5432/transporte_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas (API con PostgreSQL y app)
        run: npm test
      - name: Compilación
        run: npm run build

  importador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl pytest
      - run: python -m pytest scripts -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        env:
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: docker compose build
