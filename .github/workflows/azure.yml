# Publica la app en Azure App Service. Se ejecuta a mano (Actions → "Publicar en Azure" → Run workflow).
# Requiere que TI configure en el repositorio (Settings → Secrets and variables → Actions):
#   secretos  AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (identidad con credencial federada OIDC)
#   variable  AZURE_WEBAPP_NAME  (salida "nombreWebApp" de infra/azure/main.bicep)
# Ver docs/despliegue.md.
name: Publicar en Azure

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-publicacion
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: scripts/empaquetar.sh paquete.zip
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: paquete.zip
      - name: Verificar que la app responde
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/salud" && exit 0
            sleep 10
          done
          echo "La app no respondió en 5 minutos" && exit 1
